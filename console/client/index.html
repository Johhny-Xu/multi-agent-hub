<style>
  :root, [data-theme="dark"] {
    color-scheme: dark;
    /* token-monitor native frosted-glass palette */
    --glass-rgb: 48, 52, 56;
    --glass: rgba(var(--glass-rgb), 0.72);
    --glass-strong: rgba(58, 63, 68, 0.84);
    --panel-rgb: 16, 21, 30;
    --sunken-rgb: 4, 8, 13;
    --overlay-rgb: 255, 255, 255;
    --control-alpha: 0.038;
    --line-rgb: 232, 238, 244;
    --line: rgba(var(--line-rgb), 0.11);
    --line-strong: rgba(var(--line-rgb), 0.20);
    --text: #eef5fb;
    --fg: #d6e0ea;
    --muted: #a3adbb;
    --readable-muted: #b3becd;
    --accent: #b7ead4;
    --accent-rgb: 183, 234, 212;
    --success: #b7ead4;
    --success-rgb: 183, 234, 212;
    --blue: #73bdf5;
    --orange: #f4a073;
    --yellow: #f1d973;
    --red: #f47788;
    /* WebUI mapped tokens */
    --mcode-bg: #0c1016;
    --mcode-bg-secondary: rgba(16, 21, 30, 0.88);
    --mcode-surface: rgba(24, 29, 38, 0.84);
    --mcode-surface-raised: rgba(32, 37, 46, 0.94);
    --mcode-surface-muted: rgba(255, 255, 255, 0.042);
    --mcode-surface-hover: rgba(255, 255, 255, 0.078);
    --mcode-code-bg: rgba(4, 8, 13, 0.65);
    --mcode-text: #eef5fb;
    --mcode-text-bright: #ffffff;
    --mcode-text-muted: #a3adbb;
    --mcode-text-subtle: #6e7887;
    --mcode-border: rgba(232, 238, 244, 0.11);
    --mcode-border-strong: rgba(232, 238, 244, 0.21);
    --mcode-accent: #b7ead4;
    --mcode-accent-from: #73bdf5;
    --mcode-accent-to: #b7ead4;
    --mcode-accent-gradient: linear-gradient(135deg, rgba(183, 234, 212, 0.24) 0%, rgba(115, 189, 245, 0.24) 100%);
    --mcode-accent-glow: rgba(183, 234, 212, 0.20);
    --mcode-focus-ring: rgba(115, 189, 245, 0.28);
    --mcode-success: #b7ead4;
    --mcode-warning: #f1d973;
    --mcode-danger: #f47788;
    --mcode-primary-action-bg: rgba(183, 234, 212, 0.13);
    --mcode-primary-action-text: #eef5fb;
    --mcode-shadow: 0 22px 48px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.10);
    --mcode-card-shadow: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --mcode-scrollbar: rgba(232, 238, 244, 0.16);
    --mcode-scrollbar-hover: rgba(232, 238, 244, 0.30);
  }
  [data-theme="light"] {
    color-scheme: light;
    --mcode-bg: #f5f7fa;
    --mcode-bg-secondary: #ffffff;
    --mcode-surface: #ffffff;
    --mcode-surface-muted: #f1f4f8;
    --mcode-surface-hover: #e8edf3;
    --mcode-code-bg: #1e2430;
    --mcode-text: #0f172a;
    --mcode-text-muted: #475569;
    --mcode-text-subtle: #94a3b8;
    --mcode-border: rgba(15, 23, 42, 0.09);
    --mcode-border-strong: rgba(15, 23, 42, 0.2);
    --mcode-accent: #0f766e;
    --mcode-accent-from: #0284c7;
    --mcode-accent-to: #0f766e;
    --mcode-accent-gradient: linear-gradient(135deg, #0284c7 0%, #0f766e 100%);
    --mcode-accent-glow: rgba(15, 118, 110, 0.18);
    --mcode-focus-ring: rgba(2, 132, 199, 0.25);
    --mcode-success: #059669;
    --mcode-warning: #d97706;
    --mcode-danger: #dc2626;
    --mcode-primary-action-bg: rgba(15, 118, 110, 0.12);
    --mcode-primary-action-text: #0f172a;
    --mcode-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 23, 42, 0.04);
    --mcode-card-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    --mcode-scrollbar: rgba(0, 0, 0, 0.16);
    --mcode-scrollbar-hover: rgba(0, 0, 0, 0.32);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  [data-theme="light"] { color-scheme: light; }
  body {
    margin: 0;
    background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.07), transparent 36%), linear-gradient(180deg, #121720 0%, #090d13 100%);
    color: var(--mcode-text);
    font-family: "SF Mono", "Cascadia Mono", "JetBrains Mono", "Fira Code", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Consolas, monospace;
    font-size: 13px; line-height: 1.5;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    min-height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  .mono {
    font-family: "SF Mono", "Cascadia Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-feature-settings: "liga" 0;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mcode-scrollbar); border-radius: 999px; transition: background-color .15s ease; }
  ::-webkit-scrollbar-thumb:hover { background: var(--mcode-scrollbar-hover); }
  * { scrollbar-width: thin; scrollbar-color: var(--mcode-scrollbar) transparent; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)), rgba(38, 42, 48, 0.74);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .brand-box { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(var(--sunken-rgb), 0.45);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); flex-shrink: 0;
    overflow: hidden;
  }
  .brand-logo-img {
    width: 22px; height: 22px; object-fit: contain;
    transition: transform .2s ease;
  }
  .brand-logo:hover .brand-logo-img {
    transform: scale(1.08);
  }
  header.top h1 {
    font-size: 15px; line-height: 20px; font-weight: 700; margin: 0;
    color: var(--text);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.35);
    display: inline-block; letter-spacing: -0.2px;
  }
  header.top .sub { color: var(--muted); font-size: 11px; margin-top: 1px; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  main { padding: 24px; max-width: none; margin: 0 auto; }

  button {
    font: inherit; border-radius: 7px; border: 1px solid var(--line);
    background: rgba(var(--overlay-rgb), var(--control-alpha)); color: var(--text);
    min-height: 30px; padding: 4px 12px; cursor: pointer;
    font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: inset 0 1px 0 rgba(var(--overlay-rgb), 0.08);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transition: border-color .15s ease, background-color .15s ease, color .15s ease, transform .12s ease;
  }
  button:hover { border-color: var(--line-strong); background: rgba(var(--overlay-rgb), 0.072); }
  button:active { transform: scale(0.98); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 1px solid rgba(115, 189, 245, 0.72); outline-offset: 2px;
  }
  button.primary {
    background: rgba(var(--accent-rgb), 0.12); color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.42);
    box-shadow: inset 0 1px 0 rgba(var(--accent-rgb), 0.14);
  }
  button.primary:hover {
    border-color: rgba(var(--accent-rgb), 0.65);
    background: rgba(var(--accent-rgb), 0.18);
    color: var(--text);
  }
  button.primary:active { transform: scale(0.98); }
  button.text { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); padding: 4px 8px; }
  button.text:hover { background: rgba(var(--overlay-rgb), 0.06); border-color: var(--line); color: var(--text); }
  button.danger { color: var(--red); border-color: rgba(244, 119, 136, 0.35); background: rgba(244, 119, 136, 0.08); }
  button.danger:hover { background: rgba(244, 119, 136, 0.16); border-color: var(--red); }
  button:disabled { opacity: 0.42; border-color: var(--line); background: rgba(var(--overlay-rgb), 0.02); cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  button.small { min-height: 24px; padding: 2px 8px; font-size: 11px; border-radius: 6px; }

  select, input[type="text"], input[type="number"], textarea {
    font: inherit; color: var(--mcode-text); background: var(--mcode-surface-muted);
    border: 1px solid var(--mcode-border); border-radius: 8px; padding: 7px 12px; min-height: 36px;
    font-size: 13.5px; transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  select, select option, select optgroup { color-scheme: dark; }
  [data-theme="light"] select, [data-theme="light"] select option, [data-theme="light"] select optgroup { color-scheme: light; }
  select option, select optgroup {
    background-color: var(--mcode-surface, #161b24);
    color: var(--mcode-text, #f0f6fc);
  }
  [data-theme="light"] select option,
  [data-theme="light"] select optgroup {
    background-color: #ffffff;
    color: var(--mcode-text, #0f172a);
  }
  select option:disabled { color: var(--mcode-text-muted, #8b949e); }
  [data-theme="light"] select option:disabled { color: var(--mcode-text-muted, #475569); }
  select:hover, input[type="text"]:hover, input[type="number"]:hover, textarea:hover { border-color: var(--mcode-border-strong); }
  select:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
    outline: none; border-color: var(--mcode-accent); box-shadow: 0 0 0 3px var(--mcode-focus-ring); background: var(--mcode-surface);
  }
  textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.5; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--mcode-text-muted); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .field select, .field input, .field textarea { width: 100%; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi {
    border: 1px solid var(--mcode-border); border-radius: 12px; background: var(--mcode-surface);
    padding: 16px 20px; position: relative; overflow: hidden; transition: all .2s ease;
    box-shadow: var(--mcode-card-shadow);
  }
  .kpi:hover { border-color: var(--mcode-border-strong); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--mcode-accent-gradient); opacity: 0.85; }
  .kpi .n { font-size: 28px; font-weight: 700; line-height: 1.2; color: var(--mcode-text); letter-spacing: -0.5px; }
  .kpi .t { font-size: 12px; color: var(--mcode-text-muted); margin-top: 4px; font-weight: 500; }

  nav.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--mcode-border); margin-bottom: 20px; padding: 0 4px; }
  nav.tabs button {
    background: transparent; border: none; position: relative; color: var(--mcode-text-muted);
    min-height: 40px; padding: 8px 18px; font-weight: 500; font-size: 14px; cursor: pointer;
    transition: color .2s ease; border-radius: 8px 8px 0 0;
  }
  nav.tabs button:hover { color: var(--mcode-text); }
  nav.tabs button[aria-selected="true"] { color: var(--mcode-text); font-weight: 600; box-shadow: none; }
  nav.tabs button[aria-selected="true"]::after {
    content: ''; position: absolute; bottom: -1px; left: 8px; right: 8px; height: 2.5px;
    border-radius: 3px 3px 0 0; background: var(--mcode-accent-gradient);
  }
  section.tabpanel { display: none; }
  section.tabpanel.active { display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card {
    border: 1px solid var(--mcode-border); border-radius: 14px; background: var(--mcode-surface);
    padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: all .2s ease;
    box-shadow: var(--mcode-card-shadow);
  }
  .card:hover { border-color: var(--mcode-border-strong); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); transform: translateY(-2px); }
  .card-head { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--mcode-border); }
  .card-head h3 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.2px; }
  .pill {
    font-size: 11px; font-weight: 500; border-radius: 999px; padding: 2px 9px; white-space: nowrap;
    border: 1px solid var(--mcode-border); color: var(--mcode-text-muted); background: var(--mcode-surface-muted);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .pill.ok { color: var(--mcode-success); border-color: rgba(16, 185, 129, 0.35); background: rgba(16, 185, 129, 0.12); }
  .pill.warn { color: var(--mcode-warning); border-color: rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.12); }
  .pill.err { color: var(--mcode-danger); border-color: rgba(239, 68, 68, 0.35); background: rgba(239, 68, 68, 0.12); }
  .pill.acc { color: var(--mcode-accent); border-color: rgba(59, 130, 246, 0.35); background: rgba(59, 130, 246, 0.12); }
  .card .role { color: var(--mcode-text-muted); font-size: 13px; line-height: 1.45; }
  .card .meta { font-size: 12px; color: var(--mcode-text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; border-radius: 6px; border: 1px solid var(--mcode-border);
    padding: 2px 8px; color: var(--mcode-text-muted); background: var(--mcode-surface-muted);
    transition: all .15s ease;
  }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--mcode-border); }

  /* 子代理激活/停用 Switch */
  .agent-toggle-wrap {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    font-size: 11.5px;
  }
  .agent-toggle-input {
    display: none;
  }
  .agent-toggle-slider {
    position: relative;
    width: 32px;
    height: 18px;
    background-color: var(--mcode-border-strong, #475569);
    border-radius: 18px;
    transition: background-color 0.2s ease;
    display: inline-block;
    flex-shrink: 0;
  }
  .agent-toggle-slider::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #fff;
    top: 2px;
    left: 2px;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .agent-toggle-input:checked + .agent-toggle-slider {
    background-color: var(--mcode-success, #10b981);
  }
  .agent-toggle-input:checked + .agent-toggle-slider::after {
    transform: translateX(14px);
  }
  .agent-toggle-text {
    color: var(--mcode-text-muted);
    font-size: 11px;
    font-weight: 500;
  }
  .card.disabled-card {
    opacity: 0.65;
    background: var(--mcode-surface-muted);
    border-style: dashed;
  }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar h2 { font-size: 16px; font-weight: 600; margin: 0 auto 0 0; color: var(--mcode-text); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--mcode-border); vertical-align: middle; }
  th { color: var(--mcode-text-muted); font-weight: 600; font-size: 12px; letter-spacing: 0.3px; background: var(--mcode-surface-muted); white-space: nowrap; }
  tr:hover td { background: var(--mcode-surface-hover); }
  tr:last-child td { border-bottom: none; }
  .table-wrap { border: 1px solid var(--mcode-border); border-radius: 14px; overflow: auto; background: var(--mcode-surface); box-shadow: var(--mcode-card-shadow); }
  .table-wrap table { min-width: 720px; }

  .empty {
    border: 1px dashed var(--mcode-border); border-radius: 14px; padding: 36px 20px;
    color: var(--mcode-text-muted); text-align: center; background: var(--mcode-surface-muted);
    font-size: 13.5px; line-height: 1.6;
  }
  .banner {
    border: 1px solid rgba(239, 68, 68, 0.4); color: var(--mcode-danger); background: rgba(239, 68, 68, 0.08);
    border-radius: 12px; padding: 12px 18px; margin-bottom: 18px; display: flex; gap: 14px; align-items: center;
    backdrop-filter: blur(8px);
  }
  [hidden] { display: none !important; }
  .banner button { margin-left: auto; border-color: rgba(239, 68, 68, 0.4); color: var(--mcode-danger); background: rgba(239, 68, 68, 0.1); }
  .banner button:hover { background: rgba(239, 68, 68, 0.2); }

  dialog {
    border: 1px solid var(--mcode-border-strong); border-radius: 16px; background: var(--mcode-surface);
    color: var(--mcode-text); padding: 0; width: min(580px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    animation: modalFadeIn .2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.96) translateY(-8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  dialog .dlg-head { padding: 18px 24px; border-bottom: 1px solid var(--mcode-border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  dialog .dlg-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  dialog form { padding: 20px 24px; display: grid; gap: 14px; max-height: 70vh; overflow-y: auto; }
  dialog .dlg-foot {
    display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px 18px;
    border-top: 1px solid var(--mcode-border); background: var(--mcode-surface-muted); border-radius: 0 0 16px 16px;
  }
  dialog .err-note { color: var(--mcode-danger); font-size: 12px; display: none; align-self: center; margin-right: auto; font-weight: 500; }

  .out {
    background: var(--mcode-code-bg); border: 1px solid var(--mcode-border); border-radius: 10px;
    padding: 12px 14px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    max-height: 280px; overflow: auto; margin: 0; color: #f0f6fc;
  }
  .inflight { display: grid; gap: 14px; margin-top: 28px; }
  .inflight .card { gap: 8px; }
  .msgs { display: grid; gap: 10px; }
  .msg { border: 1px solid var(--mcode-border); border-radius: 10px; padding: 10px 14px; background: var(--mcode-surface-muted); }
  .msg .mhead { font-size: 12px; color: var(--mcode-text-muted); margin-bottom: 6px; display: flex; gap: 10px; align-items: center; }
  .msg .mtext { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.55; }
  .note-item {
    border: 1px solid var(--mcode-border); border-radius: 14px; background: var(--mcode-surface);
    padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--mcode-card-shadow); transition: all .15s ease;
  }
  .note-item:hover { border-color: var(--mcode-border-strong); }
  .note-item header { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  .note-item header .k { font-weight: 600; font-size: 14px; color: var(--mcode-text); }
  .note-item header .by { color: var(--mcode-text-subtle); font-size: 12px; margin-left: auto; }

  #toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(10px);
    background: var(--mcode-surface); color: var(--mcode-text);
    border: 1px solid var(--mcode-border-strong); border-radius: 10px; padding: 10px 20px;
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
    transition: all .22s cubic-bezier(0.16, 1, 0.3, 1); max-width: 80vw;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); z-index: 1000;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--mcode-danger); color: #fff; border-color: transparent; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4); }

  .dot {
    width: 9px; height: 9px; border-radius: 999px; display: inline-block;
    background: var(--mcode-text-subtle); transition: background-color .2s ease; position: relative;
  }
  .dot.ok { background: var(--mcode-success); box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
  .dot.ok::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid var(--mcode-success); opacity: 0.6; animation: pulseDot 2.4s infinite;
  }
  @keyframes pulseDot {
    0% { transform: scale(0.9); opacity: 0.8; }
    50% { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(0.9); opacity: 0; }
  }
  .dot.err { background: var(--mcode-danger); box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
  .skeleton { color: var(--mcode-text-subtle); padding: 36px; text-align: center; font-size: 14px; }

  /* ---- CodeBuddy 网页版交互架构: 三栏 (48px 图标栏 / 260px 平台列表 / 中央单平台对话) ---- */
  main {
    padding: 0;
    max-width: 100%;
    margin: 0;
    flex: 1;
    height: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .banner { margin: 8px 16px; border-radius: 8px; flex-shrink: 0; }
  .cb-workspace {
    display: flex;
    flex: 1;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }

  /* 栏 1: 最左侧窄图标栏 (约 48px ~ 56px) */
  nav.tabs.cb-activity-bar {
    width: 56px;
    min-width: 56px;
    flex-shrink: 0;
    background: var(--mcode-surface);
    border-right: 1px solid var(--mcode-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 8px;
    z-index: 30;
    margin: 0;
    border-radius: 0;
  }
  .cb-activity-tab {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--mcode-text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0;
    cursor: pointer;
    position: relative;
    transition: all .16s ease;
    box-shadow: none;
    min-height: 44px;
  }
  .cb-activity-tab:hover {
    background: var(--mcode-surface-hover);
    color: var(--mcode-text);
  }
  .cb-activity-tab[aria-selected="true"], .cb-activity-tab.active {
    background: rgba(59, 130, 246, 0.12);
    color: var(--mcode-accent);
    border-color: rgba(59, 130, 246, 0.28);
  }
  .cb-activity-tab[aria-selected="true"]::before, .cb-activity-tab.active::before {
    content: '';
    position: absolute;
    left: -5px;
    top: 10px;
    bottom: 10px;
    width: 3.5px;
    border-radius: 0 4px 4px 0;
    background: var(--mcode-accent);
  }
  .cb-activity-tab svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .cb-activity-tab .tab-label { font-size: 11px; font-weight: 500; line-height: 1; white-space: nowrap; }
  .cb-activity-tab .chat-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 9px;
    padding: 1px 4px;
    min-width: 14px;
    line-height: 12px;
    text-align: center;
    border-radius: 999px;
    background: linear-gradient(135deg, #ef4444, #f43f5e);
    color: #fff;
    font-weight: 700;
  }

  /* 右侧主舞台 */
  .cb-stage {
    flex: 1;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .tabpanel {
    width: 100%;
    height: 100%;
    display: none;
    overflow: hidden;
  }
  .tabpanel.active, .tabpanel:not([hidden]) {
    display: flex;
    flex-direction: column;
  }
  #panel-agents, #panel-tasks, #panel-notes {
    overflow-y: auto;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  /* 对话视图双栏组合 */
  .chat-layout {
    display: flex;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* 栏 2: 平台列表栏 (约 260px，可折叠) */
  .cb-platforms-sidebar {
    width: 260px;
    min-width: 260px;
    max-width: 260px;
    height: 100%;
    background: var(--mcode-surface);
    border-right: 1px solid var(--mcode-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width .2s cubic-bezier(0.4, 0, 0.2, 1), min-width .2s, max-width .2s, opacity .18s;
    z-index: 10;
  }
  .cb-platforms-sidebar.collapsed {
    width: 0 !important;
    min-width: 0 !important;
    max-width: 0 !important;
    opacity: 0;
    border-right: none;
    pointer-events: none;
  }
  .platform-sidebar-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--mcode-border);
    background: var(--mcode-surface);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .platform-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .platform-header-left {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .platform-header-title-btn {
    font-size: 13px;
    font-weight: 600;
    color: var(--mcode-text);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 3px 6px;
    cursor: pointer;
    transition: all .15s ease;
    user-select: none;
  }
  .platform-header-title-btn:hover {
    background: var(--mcode-surface-hover);
    border-color: var(--mcode-border);
    color: var(--mcode-accent);
  }
  .platform-header-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .icon-toggle-btn {
    width: 26px;
    height: 26px;
    padding: 0;
    min-height: 26px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--mcode-text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
  }
  .icon-toggle-btn:hover {
    background: var(--mcode-surface-hover);
    color: var(--mcode-text);
    border-color: var(--mcode-border);
  }
  .btn-toggle-all-tree {
    position: relative;
    width: 28px;
    height: 26px;
  }
  .btn-toggle-all-tree svg {
    transition: transform .2s ease;
  }
  .platform-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .platform-search-wrap input {
    width: 100%;
    height: 32px;
    min-height: 32px;
    padding: 4px 10px 4px 28px;
    font-size: 12.5px;
    border-radius: 7px;
    background: var(--mcode-surface-muted);
    border: 1px solid var(--mcode-border);
  }
  .platform-search-wrap .search-icon {
    position: absolute;
    left: 8px;
    width: 14px;
    height: 14px;
    fill: var(--mcode-text-subtle);
    pointer-events: none;
  }
  .platform-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .platform-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 9px;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    transition: all .15s ease;
    position: relative;
    user-select: none;
  }
  .platform-item:hover {
    background: var(--mcode-surface-hover);
    border-color: var(--mcode-border);
  }
  .platform-item.active {
    background: rgba(59, 130, 246, 0.1);
    border-color: rgba(59, 130, 246, 0.35);
  }
  .platform-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 2px;
  }
  .platform-chevron {
    font-size: 10px;
    color: var(--mcode-text-subtle);
    margin-left: auto;
    transition: transform .18s ease;
    user-select: none;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .platform-chevron:hover {
    background: var(--mcode-surface-hover);
    color: var(--mcode-text);
  }
  .platform-chevron.expanded {
    transform: rotate(90deg);
  }
  .platform-session-tree {
    display: flex;
    flex-direction: column;
    padding-left: 28px;
    margin: 2px 0 6px 0;
    position: relative;
    gap: 2px;
  }
  .platform-session-tree::before {
    content: '';
    position: absolute;
    left: 20px;
    top: 2px;
    bottom: 6px;
    width: 1.5px;
    background: var(--mcode-border);
    border-radius: 1px;
  }
  .session-tree-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--mcode-text-muted);
    cursor: pointer;
    transition: all .12s ease;
    border: 1px solid transparent;
    user-select: none;
    position: relative;
    gap: 6px;
  }
  .session-tree-item:hover {
    background: var(--mcode-surface-hover);
    color: var(--mcode-text);
  }
  .session-tree-item.active {
    background: rgba(59, 130, 246, 0.12);
    color: var(--mcode-accent);
    font-weight: 500;
    border-color: rgba(59, 130, 246, 0.25);
  }
  .session-tree-item.active::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 5px;
    height: 1.5px;
    background: var(--mcode-accent);
  }
  .session-tree-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .session-tree-right {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .session-tree-meta {
    font-size: 10px;
    color: var(--mcode-text-subtle);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .session-archive-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    color: var(--mcode-text-subtle);
    opacity: 0.7;
    transition: all .15s ease;
  }
  .session-tree-item:hover .session-archive-icon {
    opacity: 1;
    color: var(--mcode-text);
  }
  .session-archive-icon:hover {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444 !important;
    transform: scale(1.1);
  }
  .session-tree-new-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--mcode-accent);
    cursor: pointer;
    transition: all .12s ease;
    user-select: none;
    border: 1px dashed var(--mcode-border);
    margin-top: 2px;
  }
  .session-tree-new-btn:hover {
    background: rgba(59, 130, 246, 0.08);
    border-color: var(--mcode-accent);
  }
  .platform-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--mcode-accent);
  }
  .platform-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    letter-spacing: -0.5px;
  }
  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .avatar-brand-svg { width: 64%; height: 64%; display: block; margin: auto; }
  .platform-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .platform-name-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .platform-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--mcode-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .platform-time {
    font-size: 11px;
    color: var(--mcode-text-subtle);
    flex-shrink: 0;
  }
  .platform-preview-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .platform-msg-preview {
    font-size: 11.5px;
    color: var(--mcode-text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .platform-meta-tags {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .platform-sess-pill {
    font-size: 10px;
    background: var(--mcode-surface-muted);
    color: var(--mcode-text-subtle);
    border-radius: 4px;
    padding: 0 4px;
    border: 1px solid var(--mcode-border);
  }
  .platform-badge-pill {
    font-size: 10.5px;
    background: linear-gradient(135deg, #ef4444, #f43f5e);
    color: #fff;
    border-radius: 999px;
    padding: 0 5px;
    font-weight: 700;
    min-width: 16px;
    text-align: center;
  }

  /* 栏 3: 中央单平台对话区 */
  .chat-main {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: row;
    background: var(--mcode-bg-secondary);
    position: relative;
    overflow: hidden;
  }
  .chat-col {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .workbench {
    width: 320px;
    flex-shrink: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--mcode-border);
    background: var(--mcode-bg-secondary);
    overflow: hidden;
  }
  .workbench[hidden] {
    display: none !important;
  }
  .wb-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--mcode-border);
  }
  .wb-title {
    font-weight: 600;
    font-size: 12.5px;
  }
  .wb-count {
    font-size: 10.5px;
    color: var(--mcode-text-subtle);
    flex: 1;
  }
  .wb-close {
    background: none;
    border: none;
    color: var(--mcode-text-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
  }
  .wb-close:hover {
    color: var(--mcode-text);
    background: var(--mcode-surface-hover);
  }
  .wb-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .wb-sec-title {
    font-size: 10.5px;
    color: var(--mcode-text-subtle);
  }
  .wb-img-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .wb-img-grid img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--mcode-border);
    cursor: pointer;
  }
  .wb-file-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 7px 9px;
    border-radius: 8px;
    border: 1px solid var(--mcode-border);
    background: var(--mcode-surface-muted);
    cursor: pointer;
  }
  .wb-file-row:hover {
    background: var(--mcode-surface-hover);
  }
  .wb-file-name {
    font-size: 11.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wb-file-meta {
    font-size: 10px;
    color: var(--mcode-text-subtle);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wb-empty {
    text-align: center;
    color: var(--mcode-text-subtle);
    font-size: 12px;
    padding: 28px 0;
  }
  .wb-edge-tab, #wb-edge-tab {
    display: none !important;
    position: absolute;
    right: 0;
    top: 64px;
    z-index: 40;
    padding: 8px 6px;
    border: 1px solid var(--mcode-border);
    border-right: none;
    border-radius: 8px 0 0 8px;
    background: var(--mcode-surface);
    color: var(--mcode-text-muted);
    cursor: pointer;
    font-size: 12px;
  }
  .wb-edge-count {
    display: inline-block;
    margin-left: 4px;
    min-width: 14px;
    text-align: center;
    border-radius: 8px;
    background: #ef4444;
    color: #fff;
    font-size: 9.5px;
    padding: 0 3px;
  }
  .usage-bar {
    padding: 6px 18px; border-bottom: 1px solid var(--mcode-border); font-size: 11.5px;
    color: var(--mcode-text-subtle); cursor: pointer; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: var(--mcode-surface-muted); transition: all .15s ease; flex-shrink: 0;
  }
  .usage-bar:hover { color: var(--mcode-accent); background: var(--mcode-surface-hover); }
  .usage-bar b { color: var(--mcode-text-muted); font-weight: 600; }
  #usage-bar { display: none !important; }
  #chat-mode { display: none !important; }

  /* 紧凑状态条 (ZCode 插件风格) */
  .cb-status-bar-wrap {
    width: 100%;
    max-width: 860px;
    position: relative;
    margin-top: 5px;
    box-sizing: border-box;
  }
  .cb-status-bar {
    height: 22px;
    line-height: 22px;
    font-size: 11.5px;
    color: var(--mcode-text-subtle);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: all .15s ease;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cb-status-bar::-webkit-scrollbar { display: none; }
  .cb-status-bar:hover {
    color: var(--mcode-text);
    background: var(--mcode-surface-muted);
  }
  .cb-status-seg {
    display: inline-flex;
    align-items: center;
  }
  .cb-status-seg.cb-status-agent {
    color: var(--mcode-accent);
    font-weight: 600;
  }
  .cb-status-seg[data-sb] {
    cursor: pointer;
    border-radius: 4px;
    padding: 0 2px;
    transition: background-color .12s ease-out, color .12s ease-out;
  }
  .cb-status-seg[data-sb]:hover {
    background: var(--mcode-surface-hover, rgba(255, 255, 255, 0.08));
    color: var(--mcode-text);
  }
  .sb-cbar {
    display: inline-block;
    width: 26px;
    height: 4px;
    background: var(--mcode-border-strong, rgba(255, 255, 255, 0.15));
    border-radius: 2px;
    overflow: hidden;
    vertical-align: middle;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .sb-cbar i {
    display: block;
    height: 100%;
    border-radius: 2px;
    transition: width .2s;
  }
  .sb-tip {
    position: fixed;
    z-index: 9999;
    max-width: 380px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--mcode-border);
    background: var(--mcode-surface);
    color: var(--mcode-text);
    font-size: 11px;
    line-height: 1.6;
    white-space: pre-line;
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    display: none;
  }
  .cb-status-sep {
    color: var(--mcode-border-strong);
    opacity: 0.55;
    user-select: none;
  }


  .cb-pop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--mcode-border);
    padding-bottom: 8px;
  }
  .cb-pop-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--mcode-text);
  }
  .cb-status-sys-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--mcode-text-muted);
    cursor: pointer;
    user-select: none;
  }
  .cb-status-sys-toggle input[type="checkbox"] {
    cursor: pointer;
    accent-color: var(--mcode-accent);
  }
  .cb-pop-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cb-pop-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--mcode-text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cb-pop-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 12px;
    background: var(--mcode-surface-muted);
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--mcode-border);
  }
  .cb-pop-grid-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
  }
  .cb-pop-grid-item span { color: var(--mcode-text-subtle); }
  .cb-pop-grid-item b { color: var(--mcode-text); font-weight: 600; font-family: "JetBrains Mono", monospace; }
  .cb-pop-agents-scroll {
    max-height: 140px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--mcode-surface-muted);
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--mcode-border);
  }
  .cb-pop-agent-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    padding: 2px 0;
  }
  .cb-pop-agent-name {
    color: var(--mcode-text);
    font-weight: 500;
  }
  .cb-pop-agent-tok {
    color: var(--mcode-text-muted);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
  }
  .cb-pop-empty {
    font-size: 11.5px;
    color: var(--mcode-text-subtle);
    padding: 6px 10px;
    background: var(--mcode-surface-muted);
    border-radius: 8px;
  }
  .cb-pop-sess-row {
    font-size: 11.5px;
    color: var(--mcode-text-muted);
    background: var(--mcode-surface-muted);
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--mcode-border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cb-pop-cli-badge {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--mcode-text-subtle);
  }
  .cb-pop-cli-badge.bound {
    background: rgba(16, 185, 129, 0.15);
    color: var(--mcode-success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }
  .cb-pop-footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 4px;
    border-top: 1px solid var(--mcode-border);
  }
  .cb-pop-footer button.text {
    font-size: 11px;
    color: var(--mcode-accent);
    cursor: pointer;
  }
  .cb-pop-footer button.text:hover {
    text-decoration: underline;
  }

  /* 状态条平台配额区样式 */
  .cb-pop-quotas-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 180px;
    overflow-y: auto;
  }
  .cb-quota-plat-card {
    background: var(--mcode-surface-muted);
    border: 1px solid var(--mcode-border);
    border-radius: 8px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cb-quota-plat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .cb-quota-plat-name {
    font-weight: 600;
    font-size: 11.5px;
    color: var(--mcode-text);
  }
  .cb-quota-plan-tag {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(59, 130, 246, 0.12);
    color: #60a5fa;
    border: 1px solid rgba(96, 165, 250, 0.25);
  }
  .cb-quota-total {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    color: var(--mcode-text-muted, #94a3b8);
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(59, 130, 246, 0.08);
    border: 1px dashed rgba(96, 165, 250, 0.25);
  }
  .cb-quota-total b {
    color: #60a5fa;
    font-size: 13px;
    font-weight: 700;
  }
  .cb-quota-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 11px;
    padding: 2px 0;
  }
  .cb-quota-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .cb-quota-item-name {
    color: var(--mcode-text-muted);
  }
  .cb-quota-item-stat {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    color: var(--mcode-text);
  }
  .cb-quota-item-stat small {
    color: var(--mcode-text-subtle);
  }
  .cb-quota-bar-wrap {
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
    margin: 1px 0;
  }
  .cb-quota-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .cb-quota-reset {
    font-size: 10px;
    color: var(--mcode-text-subtle);
  }
  .cb-quota-untracked-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    background: var(--mcode-surface-muted);
    border: 1px solid var(--mcode-border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .cb-quota-untracked-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    font-size: 11px;
  }
  .cb-quota-untracked-name {
    color: var(--mcode-text-muted);
  }
  .cb-quota-untracked-tag {
    font-size: 10px;
    color: var(--mcode-text-subtle);
    background: rgba(148, 163, 184, 0.1);
    padding: 1px 4px;
    border-radius: 3px;
  }
  .cb-quota-err-text {
    font-size: 11px;
    color: var(--mcode-danger, #ef4444);
    opacity: 0.85;
  }

  /* 顶部工具栏 */
  .chat-head {
    height: 52px;
    padding: 0 16px;
    border-bottom: 1px solid var(--mcode-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--mcode-surface);
    flex-shrink: 0;
    gap: 10px;
  }
  .chat-head-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .current-agent-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .agent-avatar-sm {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .agent-meta-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .agent-id-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--mcode-text);
    white-space: nowrap;
  }
  .agent-status-badge {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.12);
    color: var(--mcode-success);
    border: 1px solid rgba(16, 185, 129, 0.28);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .agent-status-badge::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .chat-head-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .session-selector-pill {
    display: inline-flex;
    align-items: center;
    background: var(--mcode-surface-muted);
    border: 1px solid var(--mcode-border);
    border-radius: 8px;
    padding: 0 6px 0 8px;
    height: 30px;
    max-width: 220px;
    transition: all .15s ease;
  }
  .session-selector-pill:hover {
    border-color: var(--mcode-border-strong);
    background: var(--mcode-surface-hover);
  }
  .session-selector-pill .clock-icon {
    font-size: 12px;
    margin-right: 4px;
    color: var(--mcode-text-subtle);
  }
  .session-selector-pill select {
    border: none !important;
    background: transparent !important;
    padding: 0 16px 0 0 !important;
    height: 28px !important;
    min-height: 28px !important;
    font-size: 12px !important;
    color: var(--mcode-text) !important;
    max-width: 180px;
    outline: none !important;
    box-shadow: none !important;
    cursor: pointer;
  }
  .btn-sm-icon {
    height: 30px;
    min-height: 30px;
    padding: 0 12px;
    font-size: 12.5px;
  }

  /* 消息区与气泡 */
  .chat-msgs {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--mcode-bg-secondary);
  }
  .chat-empty-state {
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 480px;
    padding: 40px 24px;

  .typing .d { width: 6px; height: 6px; border-radius: 50%; background: var(--mcode-accent); animation: tbounce 1.4s ease-in-out infinite; }
  .typing .d:nth-child(2) { animation-delay: .18s; }
  .typing .d:nth-child(3) { animation-delay: .36s; }
  @keyframes tbounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 2. 工作区与活动栏：活动栏下沉为底部导航栏 */

    }
    nav.tabs.cb-activity-bar {

    .chat-head {

    #btn-chat-back {

    }

    }
    .send-btn {
      padding: 4px 10px !important;
      font-size: 12.5px !important;
    }
    .cb-status-bar-wrap {
      padding: 2px 6px !important;
    }
    .cb-status-bar {
      font-size: 10.5px !important;

    }

    }

    /* 6. 工作台抽屉：全宽侧滑展示 */
    .workbench {
      position: absolute !important;
      left: 0 !important;
      right: 0 !important;
      top: 0 !important;
      bottom: 0 !important;

  /* — 平台列表项：呼吸感卡片 + 左侧激活条 — */
  .platform-list { padding: 10px; gap: 8px; }
  .platform-item {
    border-radius: 10px; border: 1px solid transparent;
    padding: 10px 12px; position: relative;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background-color .18s ease;
  }
  .platform-item:hover {
    transform: translateX(2px);
    background: var(--mcode-surface-hover);
    box-shadow: var(--mcode-card-shadow);
  }
  .platform-item.active, .platform-item.selected {
    background: var(--mcode-surface-hover);
    border-color: var(--mcode-border);
    box-shadow: var(--mcode-card-shadow);
  }
  .platform-item.active::before, .platform-item.selected::before {
    content: ""; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px;
    border-radius: 999px; background: var(--mcode-accent-gradient);
    box-shadow: 0 0 8px var(--mcode-accent-glow);
  }
  .platform-msg-preview { color: var(--mcode-text-subtle); line-height: 1.4; }
  .platform-time { color: var(--mcode-text-subtle); font-size: 11px; font-variant-numeric: tabular-nums; }
  .platform-avatar, .avatar-img, .agent-avatar-sm {
    box-shadow: 0 0 0 1px var(--mcode-border-strong);
  }

  /* — 未读徽章：红点渐变 + 微光脉冲 — */
  .platform-badge-pill, .chat-badge, .wb-count, .cb-activity-tab .dot {
    background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
    color: #fff; box-shadow: 0 0 0 2px var(--mcode-bg-secondary), 0 2px 8px rgba(239, 68, 68, 0.45);
    font-variant-numeric: tabular-nums;
  }
  @keyframes badgePulse { 0%,100% { box-shadow: 0 0 0 2px var(--mcode-bg-secondary), 0 2px 8px rgba(239,68,68,.35); } 50% { box-shadow: 0 0 0 3px var(--mcode-bg-secondary), 0 2px 14px rgba(239,68,68,.65); } }
  .platform-badge-pill { animation: badgePulse 2.2s ease-in-out infinite; }
  .platform-sess-pill, .session-selector-pill, .current-agent-pill {
    border: 1px solid var(--mcode-border); background: var(--mcode-surface-muted);
    border-radius: 999px; font-variant-numeric: tabular-nums;
  }

  /* — 聊天气泡：用户侧渐变、代理侧左边条、系统侧居中胶囊 — */
  .chat-msgs, .msgs { scrollbar-gutter: stable; }
  .bubble { border-radius: 14px; border: 1px solid transparent; transition: border-color .16s ease, box-shadow .16s ease; }
  .bubble:hover { border-color: var(--mcode-border); box-shadow: var(--mcode-card-shadow); }
  .bubble.user {
    background: linear-gradient(135deg, rgba(37,99,235,.16) 0%, rgba(124,58,237,.14) 100%);
    border-color: rgba(37,99,235,.25);
  }
  .bubble.agent { border-left: 3px solid var(--mcode-accent); }
  .bubble.system {
    background: var(--mcode-surface-muted); color: var(--mcode-text-subtle);
    border-radius: 999px; font-size: 12px;
  }
  .bubble.md pre, .bubble pre {
    background: var(--mcode-code-bg); border: 1px solid var(--mcode-border);
    border-left: 3px solid var(--mcode-accent); border-radius: 8px; padding: 10px 12px;
  }
  .bubble a { color: var(--mcode-accent); }
  .bubble code {
    background: var(--mcode-code-bg); border: 1px solid var(--mcode-border);
    border-radius: 5px; padding: 1px 5px; font-size: 12.5px;
  }

  /* — 输入卡：玻璃拟态 + 聚焦光环 — */
  .composer-floating-wrap {
    border: 1px solid var(--mcode-border-strong); border-radius: 16px;
    background: color-mix(in srgb, var(--mcode-bg-secondary) 82%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--mcode-shadow);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .composer-floating-wrap:focus-within {
    border-color: var(--mcode-accent);
    box-shadow: 0 0 0 3px var(--mcode-focus-ring), var(--mcode-shadow);
  }
  .composer textarea:focus { outline: none; }
  .send-btn {
    border-radius: 10px; font-weight: 600;
    transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
  }
  .send-btn:not(:disabled):hover {
    transform: translateY(-1px); filter: brightness(1.12);
    box-shadow: 0 4px 16px var(--mcode-accent-glow);
  }

  /* — 底部状态栏：胶囊分段 + 等宽数字 — */
  .cb-status-bar-wrap {
    position: relative;
    border-top: 1px solid var(--mcode-border);
    background: color-mix(in srgb, var(--mcode-bg-secondary) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .cb-status-bar {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 4px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .cb-status-seg {
    border-radius: 999px; padding: 2px 9px; font-size: 12px;
    transition: background-color .16s ease, color .16s ease;
    white-space: nowrap;
    cursor: pointer;
  }
  .cb-status-seg:hover { background: var(--mcode-surface-hover); }
  .cb-status-model, .cb-status-sys-toggle { color: var(--mcode-accent); font-weight: 500; }
  .cb-status-gear {
    margin-left: auto;
    opacity: 0.65;
    font-size: 11px;
    padding: 2px 7px;
  }
  .cb-status-gear:hover {
    opacity: 1;
    background: var(--mcode-surface-hover);
  }

  /* — 状态栏自定义项弹出面板 — */
  .sb-config-panel {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 12px;
    width: 290px;
    max-width: min(92vw, 320px);
    background: var(--mcode-surface-raised, #18181c);
    border: 1px solid var(--mcode-border-strong, #3a3a46);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
    z-index: 1250;
    overflow: hidden;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 12px;
    color: var(--mcode-text);
  }
  .sb-config-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-bottom: 1px solid var(--mcode-border);
    background: color-mix(in srgb, var(--mcode-surface-raised, #18181c) 90%, #fff 10%);
  }
  .sb-config-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--mcode-text-bright, #fff);
  }
  .sb-config-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sb-config-btn-text {
    background: none;
    border: none;
    color: var(--mcode-accent, #6366f1);
    font-size: 11.5px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
    transition: background-color .14s ease;
  }
  .sb-config-btn-text:hover {
    background: rgba(99, 102, 241, 0.15);
  }
  .sb-config-close {
    background: none;
    border: none;
    color: var(--mcode-text-muted, #888);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .sb-config-close:hover {
    background: var(--mcode-surface-hover);
    color: var(--mcode-text-bright);
  }
  .sb-config-body {
    padding: 6px;
    max-height: 280px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .sb-config-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px;
    border-radius: 6px;
    user-select: none;
    cursor: pointer;
    transition: background-color .14s ease;
  }
  .sb-config-row:hover {
    background: var(--mcode-surface-hover, rgba(255, 255, 255, 0.06));
  }
  .sb-config-checkbox {
    width: 14px;
    height: 14px;
    margin: 0;
    cursor: pointer;
    accent-color: var(--mcode-accent, #6366f1);
  }
  .sb-config-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 1;
    min-width: 0;
  }
  .sb-config-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--mcode-text-bright, #eee);
  }
  .sb-config-desc {
    font-size: 10.5px;
    color: var(--mcode-text-muted, #8e8e9e);
  }
  .sb-config-footer {
    padding: 6px 12px;
    font-size: 10.5px;
    color: var(--mcode-text-muted);
    background: color-mix(in srgb, var(--mcode-bg-secondary) 60%, transparent);
    border-top: 1px solid var(--mcode-border);
    text-align: center;
  }

  /* — 配额卡片与配额条：渐变填充 + 明细清晰 — */
  .cb-quota-plat-card {
    border-radius: 12px; border: 1px solid var(--mcode-border);
    box-shadow: var(--mcode-card-shadow);
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  .cb-quota-plat-card:hover { border-color: var(--mcode-border-strong); box-shadow: var(--mcode-shadow); }
  .cb-quota-bar-wrap { height: 6px; border-radius: 999px; background: var(--mcode-surface-muted); overflow: hidden; }
  .cb-quota-bar-fill {
    border-radius: 999px;
    background: linear-gradient(90deg, var(--mcode-success) 0%, var(--mcode-accent-from) 55%, var(--mcode-accent-to) 100%);
    transition: width .6s cubic-bezier(.2,.8,.2,1);
  }
  .cb-quota-bar-fill.warn { background: linear-gradient(90deg, var(--mcode-warning) 0%, #f97316 100%); }
  .cb-quota-bar-fill.danger { background: linear-gradient(90deg, var(--mcode-danger) 0%, #f97316 100%); }
  .cb-quota-item-name { color: var(--mcode-text-muted); }
  .cb-quota-item-stat { font-variant-numeric: tabular-nums; }
  .cb-quota-plan-tag {
    border: 1px solid var(--mcode-border); border-radius: 999px;
    background: var(--mcode-surface-muted); font-size: 11px;
  }

  /* — 通用卡片 / 表格 / 模型面板 — */
  .card {
    border-radius: 12px; border: 1px solid var(--mcode-border);
    box-shadow: var(--mcode-card-shadow);
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  .card:hover { border-color: var(--mcode-border-strong); }
  .card-head { border-bottom: 1px solid var(--mcode-border); }
  .table-wrap { border-radius: 10px; overflow: hidden; border: 1px solid var(--mcode-border); }
  .model-popover-panel, .mp-model-list {
    box-shadow: var(--mcode-shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mp-model-item { border-radius: 8px; transition: background-color .14s ease; }
  .mp-model-item:hover { background: var(--mcode-surface-hover); }
  .mp-model-item.selected, .mp-model-item.active { border-left: 3px solid var(--mcode-accent); background: var(--mcode-surface-hover); }
  .mp-tag-free { background: rgba(16,185,129,.16); color: var(--mcode-success); border: 1px solid rgba(16,185,129,.3); }
  .mp-tag-depr { background: rgba(245,158,11,.14); color: var(--mcode-warning); border: 1px solid rgba(245,158,11,.3); }
  .mp-tag-promo { background: rgba(168,85,247,.16); color: #c084fc; border: 1px solid rgba(168,85,247,.35); }
  .mp-tag-discount { background: rgba(16,185,129,.16); color: var(--mcode-success); border: 1px solid rgba(16,185,129,.3); }

  /* — 数字与字距统一 — */
  .kpi .mono, .tok-chip, .cb-pop-agent-tok, .cb-pop-sess-row .mono {
    font-variant-numeric: tabular-nums; letter-spacing: -0.2px;
  }
  .empty-tip-card { border-radius: 12px; border: 1px dashed var(--mcode-border-strong); }
  .chip, .att-chip { border-radius: 999px; border: 1px solid var(--mcode-border); }

  /* — 卡片头布局：单行精致排布，头像按钮移至右侧 — */
  .card-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  }
  .card-head h3.mono {
    margin: 0; font-size: 14.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex-shrink: 1;
  }
  .card-head .pill { flex-shrink: 0; }
  .card-head .btn-avatar-setting {
    margin-left: auto; flex-shrink: 0;
    font-size: 12px; font-weight: 500;
    min-height: 24px; padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid var(--mcode-border);
    background: var(--mcode-surface-muted);
    color: var(--mcode-text-muted);
    cursor: pointer; white-space: nowrap;
    transition: all .16s ease;
  }
  .card-head .btn-avatar-setting:hover {
    color: var(--mcode-text);
    background: var(--mcode-surface-hover);
    border-color: var(--mcode-border-strong);
  }
  #modal-extra {
    color: var(--mcode-text-muted);
    font-size: 13px;
    padding: 5px 10px;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  #modal-extra:hover {
    color: var(--mcode-danger, #ef4444);
  }
  .platform-avatar {
    overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-brand-svg { display: block; width: 72%; height: 72%; }
  .avatar-brand-svg text { fill: #fff; }

  /* — 工作台计数是灰色信息文本，不是徽章（fix 红条误伤） — */
  .wb-count {
    background: none !important; box-shadow: none !important;
    color: var(--mcode-text-subtle) !important;
    font-size: 10.5px !important; font-weight: 400 !important;
    border-radius: 0 !important; padding: 0 !important;
  }
  /* 隐藏代理面板的 KPI 概览横条与卡片内冗余的底层 meta 参数行 */
  #kpis, .kpi-row { display: none !important; }
  .card .meta { display: none !important; }

  /* — 对话窗口中置与己方对话右侧锚定自适应收窄规范 — */
  .chat-msgs {
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    scrollbar-gutter: stable;
  }
  .bubble {
    box-sizing: border-box;
    width: 100%;
    max-width: 860px;
    margin-left: auto;
    margin-right: auto;
  }
  .bubble.agent {
    align-self: center !important;
    width: 100% !important;
    max-width: 860px !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  /* 己方对话：右侧对齐锚定，气泡长度从右向左计算，短文本紧凑，长文本收窄至540px */
  .bubble.user {
    align-self: flex-start !important;
    width: fit-content !important;
    max-width: min(70%, 540px) !important;
    margin-left: auto !important;
    margin-right: calc(max(0px, (100% - 860px) / 2)) !important;
    text-align: left !important;
    word-break: break-word !important;
    border-radius: 16px 16px 4px 16px !important;
  }
  .bubble.system {
    align-self: center !important;
    width: fit-content !important;
    max-width: min(85%, 700px) !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  .chat-empty-state {
    max-width: 860px;
    width: 100%;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  .typing {
    align-self: center !important;
    max-width: 860px !important;
    width: 100% !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  .composer-floating-wrap {
    max-width: 860px !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  .chat-head {
    max-width: 100%;
  }

  /* — 思考过程折叠组件样式 (深色高质感思维链) — */
  .thinking-box {
    margin: 4px 0 10px 0;
    border-radius: 10px;
    background: var(--mcode-surface-muted, rgba(255, 255, 255, 0.04));
    border: 1px solid var(--mcode-border);
    overflow: hidden;
    transition: all .16s ease;
  }
  .thinking-toggle-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: transparent;
    border: none;
    color: var(--mcode-text-muted);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    min-height: 30px;
    box-shadow: none !important;
    border-radius: 0;
    transition: background-color .15s ease, color .15s ease;
  }
  .thinking-toggle-btn:hover {
    background: var(--mcode-surface-hover);
    color: var(--mcode-text);
  }
  .thinking-icon {
    font-size: 13px;
    opacity: 0.85;
  }
  .thinking-label {
    flex: 1;
    font-size: 12px;
    letter-spacing: -0.1px;
  }
  .thinking-arrow {
    font-size: 11px;
    color: var(--mcode-text-subtle);
    transition: transform .2s ease;
  }
  .thinking-body {
    padding: 10px 14px 12px;
    border-top: 1px solid var(--mcode-border);
    font-size: 13px;
    line-height: 1.6;
    color: var(--mcode-text-muted);
    background: color-mix(in srgb, var(--mcode-code-bg) 60%, transparent);
    border-left: 3px solid var(--mcode-accent);
  }
  .thinking-body p { margin: 0 0 6px; }
  .thinking-body p:last-child { margin-bottom: 0; }
  .thinking-body code { font-size: 12px; color: var(--mcode-accent); }

  /* ---- 底部轻量 Footer ---- */
  .console-footer {
    margin-top: 36px;
    padding: 16px 6px 12px;
    border-top: 1px solid var(--mcode-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 12px;
    color: var(--mcode-text-muted);
    user-select: none;
  }
  .console-footer .footer-left,
  .console-footer .footer-right {
    display: flex;
    align-items: center;
    flex: 0 0 auto;
  }
  .console-footer .footer-center {
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .footer-donate-btn {
    background: transparent;
    border: none;
    color: var(--mcode-text-muted);
    cursor: pointer;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    transition: all .16s ease;
    line-height: 1.2;
    min-height: auto;
  }
  .footer-donate-btn:hover {
    color: #ff6b81;
    background: rgba(255, 107, 129, 0.08);
  }
  .footer-gh-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--mcode-text-muted);
    text-decoration: none;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid transparent;
    transition: all .18s ease;
  }
  .footer-gh-link:hover {
    color: var(--mcode-text);
    background: var(--mcode-surface);
    border-color: var(--mcode-border);
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
  }
  .footer-gh-link svg {
    flex-shrink: 0;
    transition: transform .2s ease;
  }
  .footer-gh-link:hover svg {
    transform: scale(1.15);
    color: var(--mcode-text);
  }
  .footer-version {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    color: var(--mcode-text-muted);
    opacity: 0.85;
  }
  @media (max-width: 640px) {
    .console-footer {
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 12px 4px;
      gap: 8px;
    }
    .console-footer .footer-center {
      order: 3;
      width: 100%;
      margin-top: 4px;
    }
  }

  /* 捐献弹窗 */
  .cb-donate-dialog {
    border: 1px solid var(--mcode-border);
    border-radius: 16px;
    background: var(--mcode-surface);
    color: var(--mcode-text);
    padding: 0;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
    max-width: 320px;
    width: 90%;
  }
  .cb-donate-dialog::backdrop {
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .cb-donate-card {
    padding: 24px 20px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .cb-donate-icon {
    font-size: 36px;
    line-height: 1;
  }
  .cb-donate-msg {
    font-size: 15px;
    font-weight: 500;
    color: var(--mcode-text);
  }
  .cb-donate-actions {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-top: 6px;
  }
  .cb-donate-btn {
    flex: 1;
    min-height: 34px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .16s ease;
  }
  .cb-donate-cancel {
    background: var(--mcode-surface-muted);
    border: 1px solid var(--mcode-border);
    color: var(--mcode-text);
  }
  .cb-donate-cancel:hover {
    background: var(--mcode-surface-hover);
  }
  .cb-donate-confirm {
    background: #ff5e7e;
    border: none;
    color: #fff;
    box-shadow: 0 2px 10px rgba(255, 94, 126, 0.35);
  }
  .cb-donate-confirm:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  /* 捐献彩蛋动画 */
  .donate-egg-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  .donate-egg-overlay.fade-out {
    opacity: 0;
  }
  .donate-egg-box {
    background: var(--mcode-surface);
    border: 1px solid var(--mcode-border);
    border-radius: 20px;
    padding: 24px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    animation: eggPop .35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }
  @keyframes eggPop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .donate-egg-heart {
    font-size: 44px;
    margin-bottom: 8px;
    animation: eggHeartBeat 1.2s ease infinite;
  }
  @keyframes eggHeartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  .donate-egg-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--mcode-text);
    margin-bottom: 4px;
  }
  .donate-egg-sub {
    font-size: 12px;
    color: var(--mcode-text-muted);
  }
