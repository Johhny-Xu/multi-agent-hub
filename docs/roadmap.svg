<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="roadmap-title roadmap-desc" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif">
  <title id="roadmap-title">multi-agent-hub 0.5 至 0.8 发展路线图与后续复测范围</title>
  <desc id="roadmap-desc">四个源码检查点于 2026 年 10 月 9 日发布，实测记录来自 10 月 8 日。0.5 增加登录与 Windows worker 检查，0.6 统一任务契约并适配 Codex、ZCode 和 DSH，0.7 拆分安装并验证 Linux 服务与跨机器任务，0.8 增加只读 Hub 发现、用户选择和鉴权配对，提供七个 MCP 工具。验证统计仅表示相应回归、发现和安装范围；DSH 付费模型流程、反向直连及部分厂商授权能力仍待复测。</desc>
  <defs>
    <style>
      .title { font-size:32px; font-weight:700; fill:#0f172a; }
      .subtitle { font-size:18px; fill:#475569; }
      .stage-title { font-size:24px; font-weight:700; fill:#0f172a; }
      .body { font-size:18px; fill:#334155; }
      .note { font-size:16px; fill:#475569; }
      .badge { font-size:16px; font-weight:700; fill:#115e59; }
      .version { font-size:18px; font-weight:700; fill:#0f766e; }
      .section-title { font-size:22px; font-weight:700; fill:#0f172a; }
      .stat-label { font-size:17px; fill:#334155; }
      .stat-number { font-size:30px; font-weight:700; fill:#0f766e; }
      .limit-title { font-size:22px; font-weight:700; fill:#78350f; }
      .limit-body { font-size:17px; fill:#78350f; }
    </style>
  </defs>

  <!-- Native SVG: edit the text and card positions directly; no external assets. -->
  <rect width="1280" height="1120" fill="#ffffff"/>
  <rect x="32" y="24" width="1216" height="1080" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="72" class="title">multi-agent-hub 发展路线图</text>
  <text x="64" y="108" class="subtitle">Git 发布：2026-10-09　｜　实测记录：2026-10-08　｜　当前源码版本：v0.8.0</text>
  <text x="64" y="140" class="note">按真实检查点连续演进；已适配的平台与宿主，不等于全部账号、模型和任务能力都通过。</text>

  <!-- Four released checkpoints. The timeline denotes version order, not separate test dates. -->
  <line x1="100" y1="230" x2="100" y2="674" stroke="#99c8c4" stroke-width="4"/>

  <g id="release-05">
    <circle cx="100" cy="230" r="23" fill="#0f766e"/>
    <text x="100" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">05</text>
    <text x="100" y="275" text-anchor="middle" class="version">v0.5</text>
    <rect x="164" y="164" width="1052" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="164" y="180" width="5" height="100" rx="2" fill="#0f766e"/>
    <text x="192" y="198" class="stage-title">登录与 Windows worker 兼容性</text>
    <rect x="1080" y="179" width="112" height="30" rx="15" fill="#ccfbf1"/>
    <text x="1136" y="200" text-anchor="middle" class="badge">源码已发布</text>
    <text x="192" y="232" class="body">官方登录链接与状态查询；国际 / 国内 CodeBuddy 使用独立配置。</text>
    <text x="192" y="258" class="body">8 个 worker 通道按报告实测，区分成功、能力不支持与授权阻塞。</text>
    <text x="192" y="282" class="note">检查点已含 Codex 初稿；不等同于所有宿主或厂商账号端到端通过。</text>
  </g>

  <g id="release-06">
    <circle cx="100" cy="378" r="23" fill="#0f766e"/>
    <text x="100" y="385" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">06</text>
    <text x="100" y="423" text-anchor="middle" class="version">v0.6</text>
    <rect x="164" y="312" width="1052" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="164" y="328" width="5" height="100" rx="2" fill="#0f766e"/>
    <text x="192" y="346" class="stage-title">统一任务契约与三个原生宿主适配</text>
    <rect x="1080" y="327" width="112" height="30" rx="15" fill="#ccfbf1"/>
    <text x="1136" y="348" text-anchor="middle" class="badge">源码已发布</text>
    <text x="192" y="380" class="body">统一 model、thinking、stream、图文附件与 cwd 任务契约。</text>
    <text x="192" y="406" class="body">Codex / ZCode / DSH 原生适配；派发一次，保留原 ref 续查。</text>
    <text x="192" y="430" class="note">不支持的选项先拒绝；正文进度与宿主 UI 实时显示分别验证。</text>
  </g>

  <g id="release-07">
    <circle cx="100" cy="526" r="23" fill="#0f766e"/>
    <text x="100" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">07</text>
    <text x="100" y="571" text-anchor="middle" class="version">v0.7</text>
    <rect x="164" y="460" width="1052" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="164" y="476" width="5" height="100" rx="2" fill="#0f766e"/>
    <text x="192" y="494" class="stage-title">拆分安装、Linux 服务与跨机器连接</text>
    <rect x="1080" y="475" width="112" height="30" rx="15" fill="#ccfbf1"/>
    <text x="1136" y="496" text-anchor="middle" class="badge">源码已发布</text>
    <text x="192" y="528" class="body">hub / plugins / both 独立包；Windows 与 Linux 运行时检测、升级保留配置。</text>
    <text x="192" y="554" class="body">Linux systemd 用户服务已实测；插件可连接异机 Hub，账号不随包复制。</text>
    <text x="192" y="578" class="note">控制台按平台、worker 和型号能力开放选项；未知状态不自动重派。</text>
  </g>

  <g id="release-08">
    <circle cx="100" cy="674" r="23" fill="#2563eb"/>
    <text x="100" y="681" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">08</text>
    <text x="100" y="719" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">v0.8</text>
    <rect x="164" y="608" width="1052" height="132" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="164" y="624" width="5" height="100" rx="2" fill="#2563eb"/>
    <text x="192" y="642" class="stage-title">只读发现、用户配对与 7 个 MCP 工具</text>
    <rect x="1080" y="623" width="112" height="30" rx="15" fill="#dbeafe"/>
    <text x="1136" y="644" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">当前版本</text>
    <text x="192" y="676" class="body">UDP 18766 + 无凭据健康检查；首次安装先扫描，用户选择目标后配对。</text>
    <text x="192" y="702" class="body">Codex / ZCode / DSH 提供 hub_discover；7 个工具，既有连接保留。</text>
    <text x="192" y="726" class="note">未配置仍可发现，派发拒绝 SETUP_REQUIRED；token 留在外部私有配置。</text>
  </g>

  <!-- Counts describe separate validation scopes; they are not worker/model pass rates. -->
  <text x="64" y="778" class="section-title">0.8 验证范围</text>
  <text x="1216" y="776" text-anchor="end" class="note">回归、网络发现与安装验收分别计数</text>
  <g id="validation-summary">
    <rect x="64" y="794" width="272" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="84" y="819" class="stat-label">Windows 完整回归</text>
    <text x="84" y="854" class="stat-number">21 / 21 组</text>
    <text x="84" y="880" class="note">冻结源码后的回归套件</text>
    <rect x="352" y="794" width="272" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="372" y="819" class="stat-label">Linux 完整回归</text>
    <text x="372" y="854" class="stat-number">19 / 19 组</text>
    <text x="372" y="880" class="note">已适配，非后续规划</text>
    <rect x="640" y="794" width="272" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="660" y="819" class="stat-label">两平台真实网络发现</text>
    <text x="660" y="854" class="stat-number">8 / 8 项</text>
    <text x="660" y="880" class="note">Python / Node，默认扫描与 IP</text>
    <rect x="928" y="794" width="288" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="948" y="819" class="stat-label">正式 ZIP 的 Linux 安装配对</text>
    <text x="948" y="854" class="stat-number">54 / 54 项</text>
    <text x="948" y="880" class="note">三包安装、鉴权与 7 工具发现</text>
  </g>

  <!-- Amber denotes an explicit validation boundary, not a platform deferred by priority. -->
  <g id="follow-up-validation">
    <rect x="64" y="918" width="1152" height="148" rx="14" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="88" y="948" class="limit-title">后续复测：外部条件恢复后补证据</text>
    <text x="88" y="977" class="limit-body">宿主：DSH 真实子代理 / 工作流因 402 额度不足未完成；Codex、ZCode 按已有报告验证。</text>
    <text x="88" y="1002" class="limit-body">网络：Windows → Linux 直连图文通过；Linux → Windows 直连未通，SSH 反向图文任务通过。</text>
    <text x="88" y="1027" class="limit-body">账号与模型：认证、区域、SSO、型号目录仍有限制；不宣称 8 个 worker 所有选项均可用。</text>
    <text x="88" y="1052" class="limit-body">下一步：复测上述阻塞，补宿主 UI 流式展示证据；不承诺完成日期。</text>
  </g>
  <text x="64" y="1094" class="note">证据：release-0.7.md · release-0.8.md · version-history.md　｜　ZIP 为本地构建，未上传 Release 附件</text>
</svg>
