<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="770" viewBox="0 0 1020 770" font-family="Segoe UI, PingFang SC, Microsoft YaHei, -apple-system, sans-serif">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="progGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- 全局背景 -->
  <rect width="1020" height="770" fill="#f8fafc"/>

  <!-- 顶部标题区 -->
  <rect x="40" y="20" width="940" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="65" y="52" font-size="20" font-weight="bold" fill="#0f172a">Multi-Agent Hub 发展路线图 / Development Roadmap</text>
  <text x="65" y="76" font-size="12" fill="#64748b">战略节奏：优先做好 Windows 本地开箱体验 ➔ 积极攻坚 DSH 生态 ➔ 随后重启完善 Linux 启动 ➔ 进军 Codex</text>
  
  <!-- 状态图例 (右上角) -->
  <rect x="620" y="42" width="76" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="658" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">已就绪 Done</text>

  <rect x="704" y="42" width="88" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="748" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">积极进行 Active</text>

  <rect x="800" y="42" width="92" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="846" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">暂缓随行 Paused</text>

  <rect x="900" y="42" width="68" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="934" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">规划 Planned</text>

  <!-- 时间轴中轴线 -->
  <line x1="75" y1="120" x2="75" y2="700" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- ======================================================== -->
  <!-- Phase 1: 核心总线与 8 大 Agent [已完成]                     -->
  <!-- ======================================================== -->
  <circle cx="75" cy="142" r="8.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="105" y="115" width="875" height="74" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="105" y="115" width="6" height="74" rx="3" fill="#10b981"/>
  <text x="125" y="138" font-size="13.5" font-weight="bold" fill="#0f172a">Phase 1: 核心任务总线与 8 大 Agent 原生无头通道 / Core Task Bus &amp; Headless Agents</text>
  <rect x="880" y="126" width="86" height="22" rx="11" fill="#dcfce7" stroke="#86efac"/>
  <text x="923" y="141" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">✅ 已完成 v0.1</text>
  <text x="125" y="159" font-size="11.5" fill="#334155">• 基于 Python 标准库开发零依赖 JSON-RPC MCP 任务总线 (:8765) 与异步 Worker 执行器</text>
  <text x="125" y="176" font-size="11" fill="#64748b">• 接入 CodeBuddy(国内/国际)、Antigravity、Copilot、MiMoCode、MiniMax、TraeCode、ZCode，支持额度耗尽自动改派</text>

  <!-- ======================================================== -->
  <!-- Phase 2: Web 控制台与移动端竖屏 [已完成]                    -->
  <!-- ======================================================== -->
  <circle cx="75" cy="232" r="8.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="105" y="205" width="875" height="74" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
  <rect x="105" y="205" width="6" height="74" rx="3" fill="#10b981"/>
  <text x="125" y="228" font-size="13.5" font-weight="bold" fill="#0f172a">Phase 2: All-in-One Web 控制台与移动端竖屏自适应 / Web Console &amp; Mobile Responsive</text>
  <rect x="880" y="216" width="86" height="22" rx="11" fill="#dcfce7" stroke="#86efac"/>
  <text x="923" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">✅ 已完成 v0.2</text>
  <text x="125" y="249" font-size="11.5" fill="#334155">• CodeBuddy 风格三栏深色 UI，全平台历史会话归组浏览，实时模型配额与连接监控</text>
  <text x="125" y="266" font-size="11" fill="#64748b">• 手机竖屏排版优化（底部导航栏、双行自适应工具栏）、思维链(&lt;think&gt;)自动折叠与对话中置对齐</text>

  <!-- ======================================================== -->
  <!-- Phase 3: Windows 原生首发就绪 & ZCode [已完成·重点精进]    -->
  <!-- ======================================================== -->
  <circle cx="75" cy="326" r="9.5" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="105" y="296" width="875" height="84" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="105" y="296" width="6" height="84" rx="3" fill="#10b981"/>
  <text x="125" y="320" font-size="14" font-weight="bold" fill="#065f46">Phase 3: Windows 首发开箱就绪 &amp; ZCode 深度集成 / Windows-First Setup &amp; ZCode Plugin</text>
  <rect x="870" y="308" width="96" height="22" rx="11" fill="#dcfce7" stroke="#86efac"/>
  <text x="918" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">✅ 重点就绪 v0.3</text>
  <text x="125" y="342" font-size="11.8" fill="#334155">• 聚焦 Windows 本地双击秒开（start.bat / stop.bat），解耦系统路径，支持 MiniMax+Trae 等任意轻量组合</text>
  <text x="125" y="359" font-size="11.8" fill="#334155">• agenthub-workers 插件无缝注册 8 大子智能体；hub-bridge MCP 攻克 30s 工作流超时，保障单文件双击直跑</text>
  <text x="125" y="374" font-size="10.5" fill="#059669">🌟 战略聚焦：将 Windows 打造为首选开箱即用平台，彻底消除环境门槛与依赖报错</text>

  <!-- ======================================================== -->
  <!-- Phase 4: 积极适配 DeepSeek Harness (DSH) [当前重点攻坚]    -->
  <!-- ======================================================== -->
  <circle cx="75" cy="428" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <rect x="105" y="396" width="875" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="105" y="396" width="6" height="88" rx="3" fill="url(#progGrad)"/>
  <text x="125" y="420" font-size="14" font-weight="bold" fill="#1d4ed8">Phase 4: 积极适配 DeepSeek Harness (DSH) 原生生态 / Actively Adapting DSH Ecosystem</text>
  <rect x="850" y="408" width="116" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="908" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">🚀 积极进行 In Progress</text>
  <text x="125" y="443" font-size="12" font-weight="600" fill="#1e293b">• 深度适配 DSH 官方 Cordis 微内核架构与 @deepseek-ai/dsh-mcp-client 客户端规范</text>
  <text x="125" y="460" font-size="11.5" fill="#334155">• 研发全量子代理预设 (Presets) 一键切换与 DSH 原生工作流 (dsh-workflow) 纯 JS 编排套件</text>
  <text x="125" y="476" font-size="10.5" fill="#2563eb">• 当前主攻：Cordis 微内核多环境隔离安全性与桌面客户端零损注入测试</text>

  <!-- ======================================================== -->
  <!-- Phase 5: Linux 生产级部署与启动体系 [暂时搁置·排在 DSH 后]  -->
  <!-- ======================================================== -->
  <circle cx="75" cy="530" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="105" y="500" width="875" height="82" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="105" y="500" width="6" height="82" rx="3" fill="#f59e0b"/>
  <text x="125" y="524" font-size="13.5" font-weight="bold" fill="#92400e">Phase 5: Linux 生产级服务化启动与环境适配 / Linux Service Automation (Next Up)</text>
  <rect x="825" y="512" width="141" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="895" y="528" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">⏸️ 暂缓搁置·排在 DSH 后</text>
  <text x="125" y="546" font-size="11.8" fill="#78350f">• 【优先级调整】为避免分散精力，Linux 启动脚本与复杂依赖部署暂时搁置，全力集中 Windows 与 DSH</text>
  <text x="125" y="563" font-size="11.5" fill="#475569">• 后续启动重点：研发 systemd 守护体系、跨发行版依赖智能自检与无头 Xvfb 桌面自动化一键配置</text>

  <!-- ======================================================== -->
  <!-- Phase 6: 进军 Codex 生态 [下阶段规划]                       -->
  <!-- ======================================================== -->
  <circle cx="75" cy="630" r="8.5" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <rect x="105" y="600" width="875" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 2" filter="url(#cardShadow)"/>
  <rect x="105" y="600" width="6" height="74" rx="3" fill="#94a3b8"/>
  <text x="125" y="624" font-size="13.5" font-weight="bold" fill="#475569">Phase 6: 适配 Codex 智能体协同生态 / Upcoming: Codex Ecosystem Integration</text>
  <rect x="875" y="612" width="91" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="920" y="627" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">⏳ 下阶段规划</text>
  <text x="125" y="645" font-size="11.5" fill="#475569">• 对接 Codex 扩展体系与上下文协议，实现跨平台智能体双向桥接</text>
  <text x="125" y="662" font-size="11" fill="#64748b">• 支持 Codex 客户端内一键分发任务至 Multi-Agent Hub 各大 Worker 并取回增量结果</text>

  <!-- 底部说明 -->
  <text x="510" y="735" text-anchor="middle" font-size="12" fill="#64748b">开发原则：优先 Windows 极致开箱 ➔ 集中力量攻坚 DSH 原生微内核 ➔ 随后完善 Linux 服务化 ➔ 拓展全球生态</text>
</svg>
