<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">multi-agent-hub 0.9.9：五种客户端、九种 worker，Windows 与 Linux 双向连接</title>
  <desc id="architecture-desc">客户端原生插件经过 MCP 桥选择并连接 Windows 或 Linux Hub。Hub 管理任务与结果，再调用九种 worker 的官方 CLI。插件与 Hub 独立安装，可以同机或跨机；Windows 到 Linux 可直接连接，Linux 到 Windows 已通过 SSH 反向转发验证。Antigravity 与 CodeArts 均具有原生客户端角色，CodeArts Linux worker 已通过 GLM-5.2 实际任务；Windows IDE 已原生派发，结果回收受宿主权限限制。当前重点是优化连接、能力提示与故障反馈体验。</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 19px; }
      .muted { fill: #52647b; }
      .blue { fill: #1d4ed8; }
      .green { fill: #0f766e; }
      .amber { fill: #92400e; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1280" height="980" rx="24" fill="#f8fafc"/>
  <text x="32" y="58" class="title">multi-agent-hub · 一张图看懂任务怎样运行</text>
  <rect x="1112" y="26" width="136" height="40" rx="20" fill="#dbeafe"/>
  <text x="1180" y="53" text-anchor="middle" class="body blue" font-weight="700">源码 v0.9.9</text>
  <text x="32" y="94" class="body muted">5 种客户端 · 9 种 worker · 插件与 Hub 独立部署 · Windows / Linux 双向连接</text>

  <!-- Read from left to right; each arrow carries tasks and their results. -->
  <g id="clients">
    <rect x="32" y="144" width="252" height="452" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="32" y="144" width="252" height="8" rx="4" fill="#2563eb"/>
    <text x="54" y="185" class="label blue">01 · 客户端</text>
    <text x="54" y="224" class="heading">你使用的原生宿主</text>
    <rect x="48" y="246" width="106" height="42" rx="8" fill="#eff6ff"/>
    <text x="101" y="274" text-anchor="middle" class="body" font-weight="700">Codex</text>
    <rect x="162" y="246" width="106" height="42" rx="8" fill="#eff6ff"/>
    <text x="215" y="274" text-anchor="middle" class="body" font-weight="700">ZCode</text>
    <rect x="48" y="296" width="106" height="42" rx="8" fill="#eff6ff"/>
    <text x="101" y="324" text-anchor="middle" class="body" font-weight="700">DSH</text>
    <rect x="162" y="296" width="106" height="42" rx="8" fill="#eff6ff"/>
    <text x="215" y="324" text-anchor="middle" font-size="19" font-weight="700">CodeArts</text>
    <rect x="48" y="346" width="220" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="158" y="375" text-anchor="middle" class="body blue" font-weight="700">Antigravity</text>
    <text x="54" y="418" class="body">原生插件与子代理</text>
    <text x="54" y="448" class="body">命令、技能与工作流</text>
    <line x1="54" y1="476" x2="262" y2="476" stroke="#e2e8f0"/>
    <text x="54" y="508" class="small muted">Windows / Linux</text>
    <text x="54" y="538" class="small muted">客户端可只装 plugins</text>
    <text x="54" y="568" class="small blue">Antigravity 原生接入</text>
  </g>

  <g id="connection">
    <rect x="320" y="144" width="220" height="452" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="320" y="144" width="220" height="8" rx="4" fill="#2563eb"/>
    <text x="342" y="185" class="label blue">02 · 连接</text>
    <text x="342" y="224" class="heading">共享 MCP 桥</text>
    <text x="342" y="267" class="body" font-weight="700">扫描→选择→配对</text>
    <text x="342" y="306" class="small muted">没找到？手动填地址</text>
    <text x="342" y="351" class="body">选定一个 Hub</text>
    <text x="342" y="383" class="small muted">本机 / 局域网 / 服务器</text>
    <line x1="342" y1="414" x2="518" y2="414" stroke="#bfdbfe"/>
    <text x="342" y="451" class="body">7 个 MCP 工具</text>
    <text x="342" y="483" class="small muted">派发任务 · 查询能力</text>
    <text x="342" y="515" class="small muted">按 ref 读取进度与结果</text>
    <text x="342" y="557" class="small blue">保存连接，随时切换</text>
  </g>

  <g id="hub">
    <rect x="576" y="144" width="250" height="452" rx="18" fill="#ecfdf5" stroke="#a7d8c4"/>
    <rect x="576" y="144" width="250" height="8" rx="4" fill="#0f766e"/>
    <text x="598" y="185" class="label green">03 · Hub</text>
    <text x="598" y="224" class="heading">任务执行的机器</text>
    <text x="598" y="267" class="body" font-weight="700">Windows / Linux</text>
    <text x="598" y="306" class="small muted">可以与客户端分开部署</text>
    <text x="598" y="351" class="body">预检模型与功能能力</text>
    <text x="598" y="383" class="small muted">思考 / 流式 / 图片 / 文件</text>
    <line x1="598" y1="414" x2="804" y2="414" stroke="#a7d8c4"/>
    <text x="598" y="451" class="body">管理任务、状态和结果</text>
    <text x="598" y="483" class="small muted">单个 Python 常驻服务</text>
    <text x="598" y="515" class="small muted">worker 按需启动</text>
    <text x="598" y="557" class="small green">Web 控制台可选</text>
  </g>

  <g id="workers">
    <rect x="862" y="144" width="386" height="452" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="862" y="144" width="386" height="8" rx="4" fill="#0f766e"/>
    <text x="886" y="185" class="label green">04 · Workers</text>
    <text x="886" y="224" class="heading">9 种官方 CLI 通道</text>
    <text x="886" y="263" class="body">Antigravity</text><text x="1224" y="263" text-anchor="end" class="small muted">agy</text>
    <text x="886" y="295" class="body">CodeBuddy 国际版</text><text x="1224" y="295" text-anchor="end" class="small muted">cb</text>
    <text x="886" y="327" class="body">CodeBuddy 国内版</text><text x="1224" y="327" text-anchor="end" class="small muted">cbcn</text>
    <text x="886" y="359" class="body">GitHub Copilot</text><text x="1224" y="359" text-anchor="end" class="small muted">gcp</text>
    <text x="886" y="391" class="body">MiMo</text><text x="1224" y="391" text-anchor="end" class="small muted">mimo</text>
    <text x="886" y="423" class="body">MiniMax</text><text x="1224" y="423" text-anchor="end" class="small muted">mmx</text>
    <text x="886" y="455" class="body">TraeCode</text><text x="1224" y="455" text-anchor="end" class="small muted">trae</text>
    <text x="886" y="487" class="body">ZCode</text><text x="1224" y="487" text-anchor="end" class="small muted">zcode</text>
    <rect x="880" y="502" width="350" height="34" rx="8" fill="#fffbeb"/>
    <text x="886" y="527" class="body" font-weight="700">CodeArts</text><text x="1218" y="526" text-anchor="end" class="small muted">Linux GLM 已实测</text>
    <text x="886" y="573" class="small muted">收到任务后调用对应模型服务</text>
  </g>
  <path d="M290 352H314" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M546 352H570" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M832 352H856" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="640" y="631" text-anchor="middle" class="small muted">任务向右派发，状态与结果沿原路返回 · 不支持的功能在执行前拒绝</text>

  <!-- Deployment choices: independent components, not Hub-to-Hub federation. -->
  <rect x="32" y="661" width="1216" height="146" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="696" class="heading">部署自由：同机或跨机，两个方向都能连接</text>
  <rect x="56" y="718" width="438" height="72" rx="10" fill="#eff6ff"/>
  <text x="76" y="744" class="body blue" font-weight="700">Windows 客户端 ⇄ Linux Hub</text>
  <text x="76" y="778" class="small muted">局域网直连已验收</text>
  <rect x="510" y="718" width="470" height="72" rx="10" fill="#ecfdf5"/>
  <text x="530" y="744" class="body green" font-weight="700">Linux 客户端 ⇄ Windows Hub</text>
  <text x="530" y="778" class="small muted">已通过 SSH 反向转发验收</text>
  <text x="1004" y="747" class="body" font-weight="700">也可同机安装</text>
  <text x="1004" y="777" class="small muted">plugins / hub / both</text>

  <rect x="32" y="831" width="1216" height="108" rx="18" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="56" y="866" class="heading blue">模型服务商 · 实际的数据流</text>
  <text x="56" y="898" class="body">客户端 → Hub → 官方 CLI → 模型服务商；提示词、附件和工具结果可能发送到服务商。</text>
  <text x="56" y="929" class="small muted">账号与模型需单独配置；CodeArts 原生安装通信通过不等于独立模型调用成功；Antigravity 现支持客户端角色。</text>
  <text x="32" y="965" class="small muted">当前源码 v0.9.9 · 体验优化持续进行 · 具体型号与限制见 README / docs 目录</text>
</svg>
