<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">AgentHub 0.8：插件与 Hub 独立部署架构</title>
  <desc id="architecture-desc">Codex、ZCode、DSH 插件可运行在 Windows 或 Linux，通过自动发现与鉴权配对选择本机或远端 Hub。Hub 按 worker、平台和模型能力派发任务到八种适配器，官方通道可能向模型服务商发送提示词、附件和工具结果。每个插件进程连接一个配置的 Hub，安装组件本身不触发模型调用。</desc>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #172b46; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; }
      .muted { fill: #52647b; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; font-size: 14px; }
      .blue { fill: #1d4ed8; }
      .green { fill: #047857; }
    </style>
  </defs>
  <rect width="1280" height="1120" fill="#f8fafc"/>
  <text x="40" y="56" class="title">AgentHub：插件在你手边，任务在 Hub 执行</text>
  <text x="40" y="86" class="body muted">Windows / Linux 同机或跨机部署 · 客户端选择连接位置 · 0.8.0</text>
  <rect x="1090" y="32" width="150" height="34" rx="17" fill="#dbeafe"/>
  <text x="1165" y="55" text-anchor="middle" class="small blue" font-weight="700">更新 2026-10-09</text>

  <!-- Three independently installable distributions. -->
  <rect x="40" y="112" width="1200" height="56" rx="12" fill="#ffffff" stroke="#dbe3ed"/>
  <text x="62" y="147" class="body"><tspan font-weight="700" class="blue">plugins</tspan><tspan>  只装宿主插件与桥</tspan></text>
  <line x1="422" y1="126" x2="422" y2="154" stroke="#dbe3ed"/>
  <text x="450" y="147" class="body"><tspan font-weight="700" class="green">hub</tspan><tspan>  只装任务服务与适配器</tspan></text>
  <line x1="824" y1="126" x2="824" y2="154" stroke="#dbe3ed"/>
  <text x="850" y="147" class="body"><tspan font-weight="700">both</tspan><tspan>  两端组件一起安装</tspan></text>

  <!-- Client and Hub are separate machines or colocated components. -->
  <rect x="40" y="196" width="392" height="606" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="472" y="196" width="768" height="606" rx="18" fill="#ffffff" stroke="#a7cfbf"/>
  <text x="64" y="232" class="heading">插件端</text>
  <text x="410" y="231" text-anchor="end" class="small muted">Windows / Linux</text>
  <text x="498" y="232" class="heading">Hub 端</text>
  <text x="1214" y="231" text-anchor="end" class="small muted">本机或服务器 · Windows / Linux</text>

  <rect x="64" y="254" width="104" height="68" rx="10" fill="#eff6ff"/>
  <text x="116" y="283" text-anchor="middle" font-size="18" font-weight="700">Codex</text>
  <text x="116" y="306" text-anchor="middle" class="small muted">子代理 / 技能</text>
  <rect x="184" y="254" width="104" height="68" rx="10" fill="#eff6ff"/>
  <text x="236" y="283" text-anchor="middle" font-size="18" font-weight="700">ZCode</text>
  <text x="236" y="306" text-anchor="middle" class="small muted">代理 / 工作流</text>
  <rect x="304" y="254" width="104" height="68" rx="10" fill="#eff6ff"/>
  <text x="356" y="283" text-anchor="middle" font-size="18" font-weight="700">DSH</text>
  <text x="356" y="306" text-anchor="middle" class="small muted">预设 / 工作流</text>

  <rect x="64" y="352" width="344" height="204" rx="12" fill="#f8fafc" stroke="#dbe3ed"/>
  <text x="84" y="382" class="body" font-weight="700">共享 MCP 桥 · 7 个工具</text>
  <text x="84" y="417" class="mono">hub_ask</text><text x="254" y="417" class="mono">hub_dispatch</text>
  <text x="84" y="444" class="mono">hub_fetch</text><text x="254" y="444" class="mono">hub_status</text>
  <text x="84" y="471" class="mono">hub_capabilities</text><text x="254" y="471" class="mono">hub_login</text>
  <text x="84" y="498" class="mono">hub_discover</text><text x="254" y="498" class="small muted">只读发现</text>
  <text x="84" y="534" class="small muted">由宿主启动 Node 桥，不另启本地 Hub</text>

  <rect x="64" y="584" width="344" height="190" rx="12" fill="#eff6ff"/>
  <text x="84" y="615" class="body blue" font-weight="700">先扫描，再选择与配对</text>
  <text x="84" y="645" class="small">1. 扫描本机 / 局域网，UDP 18766</text>
  <text x="84" y="672" class="small">2. 选择目标；没找到则手动填写 URL</text>
  <text x="84" y="699" class="small">3. 使用 token 文件或隐藏输入完成鉴权</text>
  <text x="84" y="735" class="small muted">一个插件进程按配置连接一个 Hub</text>
  <text x="84" y="757" class="small muted">已有连接保留，可用 connect 向导切换</text>

  <rect x="504" y="254" width="704" height="150" rx="12" fill="#ecfdf5" stroke="#b3dfcd"/>
  <text x="526" y="286" class="heading green">Python 任务总线 · HTTP / MCP</text>
  <text x="526" y="315" class="body">异步任务 / ref 查询 / 结果与状态管理</text>
  <text x="526" y="342" class="body">按 Hub 系统、worker、模型预检能力与可用性</text>
  <text x="526" y="382" class="small muted">默认单服务；Web 控制台可选；Linux 支持用户级 systemd</text>

  <!-- The connection crosses the deployment boundary in both directions. -->
  <path d="M 410 365 H 501" fill="none" stroke="#2563eb" stroke-width="2" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"/>
  <rect x="417" y="334" width="78" height="22" rx="6" fill="#ffffff"/>
  <text x="456" y="350" text-anchor="middle" font-size="12" class="blue">HTTP / MCP</text>
  <rect x="420" y="378" width="72" height="22" rx="6" fill="#ffffff"/>
  <text x="456" y="394" text-anchor="middle" font-size="12" class="muted">任务 / 结果</text>

  <text x="504" y="440" class="body" font-weight="700">8 个 worker 适配器</text>
  <text x="1208" y="440" text-anchor="end" class="small muted">以下为配置默认模型；实际可用性需预检</text>
  <g>
    <rect x="504" y="460" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="520" y="485" font-size="16" font-weight="600">Antigravity · agy</text>
    <text x="520" y="508" class="mono muted">gemini-3.8-flash-medium</text>
  </g>
  <g>
    <rect x="864" y="460" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="880" y="485" font-size="16" font-weight="600">CodeBuddy 国际版 · cb</text>
    <text x="880" y="508" class="mono muted">deepseek-v4.1-flash</text>
  </g>
  <g>
    <rect x="504" y="537" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="520" y="562" font-size="16" font-weight="600">CodeBuddy 国内版 · cbcn</text>
    <text x="520" y="585" class="mono muted">deepseek-v4.1-flash</text>
  </g>
  <g>
    <rect x="864" y="537" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="880" y="562" font-size="16" font-weight="600">GitHub Copilot · gcp</text>
    <text x="880" y="585" class="mono muted">auto</text>
  </g>
  <g>
    <rect x="504" y="614" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="520" y="639" font-size="16" font-weight="600">MiMoCode · mimo</text>
    <text x="520" y="662" class="mono muted">xiaomi/mimo-v2.6-flash (26f)</text>
  </g>
  <g>
    <rect x="864" y="614" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="880" y="639" font-size="16" font-weight="600">MiniMax · mmx</text>
    <text x="880" y="662" class="mono muted">MiniMax-M3.1-Flash-Preview</text>
  </g>
  <g>
    <rect x="504" y="691" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="520" y="716" font-size="16" font-weight="600">TraeCode · trae</text>
    <text x="520" y="739" class="mono muted">GLM-5.3-FlashX</text>
  </g>
  <g>
    <rect x="864" y="691" width="344" height="66" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="880" y="716" font-size="16" font-weight="600">ZCode · zcode</text>
    <text x="880" y="739" class="mono muted">GLM-5.3-Flash</text>
  </g>
  <text x="504" y="783" class="small muted">官方 CLI / app-server / 已配置网关；任务执行时按需启动进程</text>

  <!-- Vendor services are outside the Hub host's deployment boundary. -->
  <path d="M 856 804 V 830" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <rect x="40" y="834" width="1200" height="122" rx="14" fill="#eaf2ff" stroke="#bfd2ef"/>
  <text x="64" y="870" class="heading blue">模型服务商</text>
  <text x="64" y="900" class="body">插件 → Hub → 官方通道 → 模型服务：提示词、附件和工具结果可能发送给服务商。</text>
  <text x="64" y="929" class="body muted">宿主自身的编排模型也可能处理任务内容。自托管 Hub 不代表模型离线或数据不会离开设备。</text>

  <rect x="40" y="978" width="1200" height="100" rx="14" fill="#fffbeb" stroke="#ecd5a2"/>
  <text x="64" y="1007" font-size="17" font-weight="700" fill="#80521c">连接与能力边界</text>
  <text x="64" y="1034" font-size="16" fill="#715529">发现不等于认证成功；每种模型分别约束思考、流式与附件，不能用安装成功代替任务成功。</text>
  <text x="64" y="1060" font-size="16" fill="#715529">Windows → Linux 图文任务直连通过；Linux → Windows 当前经 SSH 反向转发通过，直连未通过。</text>
  <text x="40" y="1102" class="small muted">组件版本：Hub / MCP / Codex / ZCode 0.8.0 · DSH 1.2.0　|　证据与限制见 README、release-0.7.md、release-0.8.md</text>
</svg>
