<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="roadmap-title roadmap-desc" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif">
  <title id="roadmap-title">multi-agent-hub roadmap: v1.0.17 lets the workbench open local files the chat mentions</title>
  <desc id="roadmap-desc">v1.0.17 builds on v1.0.1 (13 Workers) by allowing local paths that really appear in this conversation, still exist and carry a whitelisted extension: the three workbench cards now preview images and open text, per-item removal only drops the row and the empty state can restore it; the WebUI is tightened too (draggable agent cards, opencode / cline accent colours, button group pinned to the right edge, sidebar auto-collapse predicate fixed), the Linux template ships a usable GitHub Copilot worker, and the credentials &amp; privacy audit stays clean.</desc>
  <defs>
    <style>
      .title { font-size:34px; font-weight:700; fill:#0f172a; }
      .meta { font-size:20px; fill:#475569; }
      .focus { font-size:42px; font-weight:700; fill:#0f172a; }
      .lead { font-size:21px; fill:#334155; }
      .section { font-size:25px; font-weight:700; fill:#0f172a; }
      .body { font-size:21px; fill:#334155; }
      .version { font-size:26px; font-weight:700; fill:#0f766e; }
      .stage { font-size:20px; fill:#334155; }
      .stat { font-size:24px; font-weight:700; fill:#0f766e; }
      .note { font-size:20px; fill:#475569; }
    </style>
    <marker id="timeline-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="1040" fill="#ffffff"/>
  <rect x="32" y="24" width="1216" height="992" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="76" class="title">multi-agent-hub roadmap</text>
  <text x="64" y="108" class="meta">Updated 2026-10-17 · Current version v1.0.17 · 6 native hosts + any MCP client · Apache-2.0</text>

  <!-- The current source checkpoint is deliberately separate from published tags. -->
  <g id="current-focus">
    <rect x="64" y="130" width="1152" height="364" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="64" y="130" width="8" height="364" rx="4" fill="#2563eb"/>
    <text x="96" y="172" font-size="24" font-weight="700" fill="#2563eb">v1.0.17 · current focus</text>
    <rect x="916" y="151" width="268" height="36" rx="18" fill="#dbeafe"/>
    <text x="1050" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Local files open</text>
    <text x="96" y="227" class="focus">The workbench opens local files the chat mentions</text>
    <text x="96" y="262" class="lead">Artifacts / images / attachments · per-conversation path allowlist · inline preview</text>

    <line x1="656" y1="294" x2="656" y2="465" stroke="#e2e8f0" stroke-width="2"/>
    <text x="96" y="311" font-size="24" font-weight="700" fill="#0f766e">Already in place</text>
    <circle cx="102" cy="343" r="5" fill="#0f766e"/>
    <text x="120" y="351" class="body">Any MCP client + 6 native deep hosts</text>
    <circle cx="102" cy="376" r="5" fill="#0f766e"/>
    <text x="120" y="384" class="body">9-vendor OAuth · instant account switch</text>
    <circle cx="102" cy="409" r="5" fill="#0f766e"/>
    <text x="120" y="417" class="body">Singleflight merge · 360-way concurrency</text>
    <circle cx="102" cy="442" r="5" fill="#0f766e"/>
    <text x="120" y="450" class="body">6 dual presets + glass + accents</text>

    <text x="692" y="311" font-size="24" font-weight="700" fill="#2563eb">What this release ships</text>
    <circle cx="698" cy="343" r="5" fill="#2563eb"/>
    <text x="716" y="351" class="body">Conversation path scan + /api/artifact/raw</text>
    <circle cx="698" cy="376" r="5" fill="#2563eb"/>
    <text x="716" y="384" class="body">Draggable agent cards · accent colours</text>
    <circle cx="698" cy="409" r="5" fill="#2563eb"/>
    <text x="716" y="417" class="body">Button group pinned right · edges aligned</text>
    <circle cx="698" cy="442" r="5" fill="#2563eb"/>
    <text x="716" y="450" class="body">Linux template ships GitHub Copilot</text>
    <text x="692" y="476" class="note">Audit stays 0 · all 13 Workers from 1.0.1 still stand.</text>
  </g>

  <text x="64" y="541" class="section">Version history</text>
  <text x="1216" y="539" text-anchor="end" class="note">Each step keeps what came before</text>
  <g id="version-timeline">
    <rect x="64" y="560" width="216" height="146" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="88" y="602" class="version">v0.5–0.6</text>
    <text x="88" y="646" class="stage">Windows support</text>
    <text x="88" y="675" class="stage">Task contract</text>

    <line x1="284" y1="634" x2="294" y2="634" stroke="#94a3b8" stroke-width="2" marker-end="url(#timeline-arrow)"/>
    <rect x="298" y="560" width="216" height="146" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="322" y="602" class="version">v0.7–0.8</text>
    <text x="322" y="646" class="stage">Plugin/Hub split</text>
    <text x="322" y="675" class="stage">Auto-discovery</text>

    <line x1="518" y1="634" x2="528" y2="634" stroke="#94a3b8" stroke-width="2" marker-end="url(#timeline-arrow)"/>
    <rect x="532" y="560" width="216" height="146" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="556" y="602" class="version">v0.9.0–0.9.4</text>
    <text x="556" y="646" class="stage">6 hosts, 9 CLIs</text>
    <text x="556" y="675" class="stage">3-pane console</text>

    <line x1="752" y1="634" x2="762" y2="634" stroke="#94a3b8" stroke-width="2" marker-end="url(#timeline-arrow)"/>
    <rect x="766" y="560" width="216" height="146" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="790" y="602" class="version">v0.9.9.2</text>
    <text x="790" y="646" class="stage">9-vendor OAuth</text>
    <text x="790" y="675" class="stage">Load hardening</text>

    <line x1="986" y1="634" x2="996" y2="634" stroke="#94a3b8" stroke-width="2" marker-end="url(#timeline-arrow)"/>
    <rect x="1000" y="560" width="216" height="146" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="1024" y="602" font-size="25" font-weight="700" fill="#2563eb">v1.0.17</text>
    <text x="1024" y="646" font-size="20" font-weight="700" fill="#1d4ed8">Local files open</text>
    <text x="1024" y="675" class="stage">Files from the chat</text>
  </g>

  <!-- These are validation scopes, not a success rate for every model or option. -->
  <text x="64" y="753" class="section">Verified so far</text>
  <g id="validation-summary">
    <rect x="64" y="775" width="368" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="88" y="807" class="body">Windows regression &amp; DOM</text>
    <text x="88" y="848" class="stat">32 suites + 7 DOM checks</text>

    <rect x="448" y="775" width="368" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="472" y="807" class="body">Linux regression &amp; load tests</text>
    <text x="472" y="848" class="stat">29 suites + &gt;4,500 loads</text>

    <rect x="832" y="775" width="384" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="856" y="807" class="body">Windows ↔ Linux &amp; audit</text>
    <text x="856" y="848" class="stat">Two-way link + 0 leaks</text>
  </g>

  <g id="authentication-boundary">
    <rect x="64" y="891" width="1152" height="70" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="88" y="921" font-size="22" font-weight="700" fill="#92400e">Scope note: existing regressions pass; not every model is live-tested.</text>
    <text x="88" y="949" font-size="20" fill="#92400e">Communication &amp; contract verified; not every model's thinking, streaming and attachments were tested.</text>
  </g>
  <text x="64" y="993" class="note">History: CHANGELOG.md and docs/version-history.md · Apache License 2.0 (original copyright retained)</text>
</svg>
